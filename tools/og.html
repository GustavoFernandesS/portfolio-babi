<!doctype html>
<!--
  Fonte da public/og.png — a imagem que aparece quando o link é compartilhado
  no LinkedIn, WhatsApp etc. Regenere com `npm run og` depois de editar.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Karla:wght@400..600&family=Courier+Prime:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #f8ebec;
        color: #2e1a1f;
        font-family: "Karla", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .stamp {
        display: flex;
        justify-content: space-between;
        font-family: "Courier Prime", monospace;
        font-size: 20px;
        color: #a98d93;
        border-bottom: 1px solid #e2c9cd;
        padding-bottom: 16px;
      }
      h1 {
        font-family: "Young Serif", Georgia, serif;
        font-weight: 400;
        font-size: 92px;
        line-height: 1;
        letter-spacing: -0.02em;
        margin-top: 30px;
      }
      .row { display: flex; align-items: flex-start; gap: 56px; margin-top: 34px; }
      .col { flex: 1 1 auto; min-width: 0; }
      .thesis {
        font-family: "Young Serif", Georgia, serif;
        font-size: 33px;
        line-height: 1.24;
        max-width: 15ch;
      }
      .record { margin-top: 28px; }
      .record div {
        display: flex;
        gap: 20px;
        padding: 11px 0;
        border-top: 1px solid #e2c9cd;
        font-size: 20px;
      }
      .record dt {
        font-family: "Courier Prime", monospace;
        color: #a98d93;
        flex: 0 0 118px;
      }
      .record dd { font-weight: 500; }
      .card {
        flex: 0 0 396px;
        background: #fffbfb;
        border: 1px solid #e2c9cd;
        border-radius: 12px;
        padding: 20px;
      }
      .card h2 {
        font-family: "Young Serif", Georgia, serif;
        font-size: 20px;
        font-weight: 400;
        padding-bottom: 11px;
        border-bottom: 1px solid #e2c9cd;
      }
      .card svg { display: block; width: 100%; height: auto; margin-top: 12px; }
      .pole { font-family: "Courier Prime", monospace; font-size: 13px; fill: #6e4c54; }
      .pole-r { text-anchor: start; fill: #a98d93; }
      .pole-l { text-anchor: end; }
      .track { stroke: #e2c9cd; stroke-width: 1; }
      .line { fill: none; stroke: #c2415f; stroke-width: 2; stroke-linejoin: round; }
      .mark { fill: #fffbfb; stroke: #c2415f; stroke-width: 2.6; }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #e2c9cd;
        padding-top: 20px;
        font-family: "Courier Prime", monospace;
        font-size: 19px;
        color: #6e4c54;
      }
      .glyph { width: 42px; height: 42px; color: #c2415f; }
    </style>
  </head>
  <body>
    <div>
      <div class="stamp">
        <span>Registro profissional</span>
        <span>São Paulo, Brasil</span>
      </div>

      <h1>Barbara Paschoalini</h1>

      <div class="row">
        <div class="col">
          <p class="thesis">Transformo diagnóstico de pessoas em processo que a equipe roda sem mim.</p>
          <dl class="record">
            <div><dt>cargo</dt><dd>Consultora de Projetos, Consultoria RH Junior</dd></div>
            <div><dt>formação</dt><dd>Psicologia · Mackenzie</dd></div>
          </dl>
        </div>

        <div class="card">
          <h2>Perfil de estilo de trabalho</h2>
          <svg viewBox="0 0 460 250">
            <g class="pole">
              <text class="pole-l" x="102" y="30">Evidência</text><text class="pole-r" x="358" y="30">Intuição</text>
              <text class="pole-l" x="102" y="78">Processo</text><text class="pole-r" x="358" y="78">Improviso</text>
              <text class="pole-l" x="102" y="126">Escuta</text><text class="pole-r" x="358" y="126">Direção</text>
              <text class="pole-l" x="102" y="174">Individual</text><text class="pole-r" x="358" y="174">Coletivo</text>
              <text class="pole-l" x="102" y="222">Profundidade</text><text class="pole-r" x="358" y="222">Velocidade</text>
            </g>
            <g class="track">
              <line x1="116" y1="26" x2="344" y2="26" /><line x1="116" y1="74" x2="344" y2="74" />
              <line x1="116" y1="122" x2="344" y2="122" /><line x1="116" y1="170" x2="344" y2="170" />
              <line x1="116" y1="218" x2="344" y2="218" />
            </g>
            <polyline class="line" points="154,26 154,74 192,122 306,170 192,218" />
            <circle class="mark" cx="154" cy="26" r="5.5" /><circle class="mark" cx="154" cy="74" r="5.5" />
            <circle class="mark" cx="192" cy="122" r="5.5" /><circle class="mark" cx="306" cy="170" r="5.5" />
            <circle class="mark" cx="192" cy="218" r="5.5" />
          </svg>
        </div>
      </div>
    </div>

    <div class="foot">
      <span>Consultoria RH Junior · aberta a estágio em RH</span>
      <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M7 12 V16.5 C7 20.9 11 24.4 16 24.4 C21 24.4 25 20.9 25 16.5 V12" />
          <path d="M16 7 V28.5" />
        </g>
        <circle cx="7" cy="12" r="2.1" fill="currentColor" />
        <circle cx="25" cy="12" r="2.1" fill="#2e1a1f" />
      </svg>
    </div>
  </body>
</html>
