<!doctype html>
<!--
  Source for public/og.png (the link preview card used by LinkedIn, WhatsApp, etc).
  Regenerate after editing — see README.
-->
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..700&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; }
      body {
        width: 1200px;
        height: 630px;
        background: #e9ebf2;
        color: #14161f;
        font-family: "Newsreader", Georgia, serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 68px 72px;
        background-image:
          repeating-linear-gradient(to right, transparent 0 31px, rgb(209 214 230 / 0.5) 31px 32px),
          repeating-linear-gradient(to bottom, transparent 0 31px, rgb(209 214 230 / 0.5) 31px 32px);
      }
      .eyebrow {
        font-family: "IBM Plex Mono", monospace;
        font-size: 19px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #2a31a8;
      }
      h1 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-weight: 600;
        font-size: 104px;
        line-height: 0.92;
        letter-spacing: -0.045em;
        margin-top: 26px;
      }
      .thesis {
        font-style: italic;
        font-size: 34px;
        line-height: 1.28;
        max-width: 22ch;
        margin-top: 30px;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid #d1d6e6;
        padding-top: 24px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        letter-spacing: 0.06em;
        color: #474d63;
      }
      .glyph { width: 46px; height: 46px; color: #2a31a8; }
      .row { display: flex; align-items: center; gap: 56px; }
      .col { flex: 1 1 auto; min-width: 0; }
      .card {
        flex: 0 0 400px;
        background: #fbfbfd;
        border: 1px solid #d1d6e6;
        border-radius: 3px;
        padding: 22px 20px;
        box-shadow: 0 22px 46px -34px rgb(20 22 31 / 0.5);
      }
      .card h2 {
        font-family: "Bricolage Grotesque", sans-serif;
        font-size: 19px;
        font-weight: 600;
        padding-bottom: 12px;
        border-bottom: 1px solid #d1d6e6;
      }
      .card svg { display: block; width: 100%; height: auto; margin-top: 10px; }
      .pole { font-family: "IBM Plex Mono", monospace; font-size: 13px; fill: #474d63; }
      .pole-r { text-anchor: start; fill: #868da6; }
      .pole-l { text-anchor: end; }
      .track { stroke: #b9c0d6; stroke-width: 1; }
      .line { fill: none; stroke: #2a31a8; stroke-width: 1.8; stroke-linejoin: round; }
      .mark { fill: #fbfbfd; stroke: #2a31a8; stroke-width: 2.4; }
    </style>
  </head>
  <body>
    <div class="row">
      <div class="col">
      <p class="eyebrow">RH e comportamento organizacional · São Paulo</p>
      <h1>Barbara<br />Paschoalini</h1>
      <p class="thesis">Transformo diagnóstico de pessoas em processo que a equipe roda sem mim.</p>
      </div>

      <div class="card">
        <h2>Perfil de estilo de trabalho</h2>
        <svg viewBox="0 0 460 250">
          <g class="pole">
            <text class="pole-l" x="102" y="30">Evidência</text><text class="pole-r" x="358" y="30">Intuição</text>
            <text class="pole-l" x="102" y="78">Processo</text><text class="pole-r" x="358" y="78">Improviso</text>
            <text class="pole-l" x="102" y="126">Escuta</text><text class="pole-r" x="358" y="126">Direção</text>
            <text class="pole-l" x="102" y="174">Individual</text><text class="pole-r" x="358" y="174">Coletivo</text>
            <text class="pole-l" x="102" y="222">Profundidade</text><text class="pole-r" x="358" y="222">Velocidade</text>
          </g>
          <g class="track">
            <line x1="116" y1="26" x2="344" y2="26" /><line x1="116" y1="74" x2="344" y2="74" />
            <line x1="116" y1="122" x2="344" y2="122" /><line x1="116" y1="170" x2="344" y2="170" />
            <line x1="116" y1="218" x2="344" y2="218" />
          </g>
          <polyline class="line" points="154,26 154,74 192,122 306,170 192,218" />
          <circle class="mark" cx="154" cy="26" r="5.5" /><circle class="mark" cx="154" cy="74" r="5.5" />
          <circle class="mark" cx="192" cy="122" r="5.5" /><circle class="mark" cx="306" cy="170" r="5.5" />
          <circle class="mark" cx="192" cy="218" r="5.5" />
        </svg>
      </div>
    </div>

    <div class="foot">
      <span>Consultora de Projetos · Consultoria RH Junior</span>
      <svg class="glyph" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M7 12 V16.5 C7 20.9 11 24.4 16 24.4 C21 24.4 25 20.9 25 16.5 V12" />
          <path d="M16 7 V28.5" />
        </g>
        <circle cx="7" cy="12" r="2.1" fill="currentColor" />
        <circle cx="25" cy="12" r="2.1" fill="#b23a63" />
      </svg>
    </div>
  </body>
</html>
